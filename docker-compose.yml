services:
  db:
    image: mysql:8.0
    container_name: lingoflow-db
    restart: always
    environment:
      MYSQL_DATABASE: lingo_db
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "3307:3306"
    volumes:
      - ./LingoFlowSQL/sql.sql:/docker-entrypoint-initdb.d/init.sql
      - lingoflow-db-data:/var/lib/mysql

  backend:
    build: ./LingoFlowBackend
    container_name: lingoflow-backend
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/lingo_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
      - SPRING_AI_OPENAI_BASE_URL=http://ollama:11434
      - SPRING_AI_OPENAI_API_KEY=ollama
      - SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL=glm4

  ollama:
    image: ollama/ollama:latest
    container_name: lingoflow-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # 如果你有英伟达显卡，取消下面这段注释可以开启显卡加速
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build: ./LingoFlowFrontend
    container_name: lingoflow-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  lingoflow-db-data:
  ollama-data:
